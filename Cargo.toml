[workspace]
resolver = "3"
members = ["crates/oxbench-core", "crates/oxbench-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# The crates are internal (publish = false); CoreError already describes each failure.
missing_errors_doc = "allow"

[profile.release]
codegen-units = 1
lto = true
strip = true
