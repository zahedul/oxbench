name: Release

# Pushing a tag such as v0.2.0 builds the installers and attaches them to a draft release.
# The draft is published by hand after checking it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            formats: app,dmg
            files: target/packages/*.dmg
          - os: windows-latest
            formats: nsis
            files: target/packages/*-setup.exe
          - os: ubuntu-22.04
            formats: deb,appimage
            files: |
              target/packages/*.deb
              target/packages/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8

      # Without a Developer ID the app stays ad-hoc signed and is not notarised. Adding the
      # APPLE_* secrets switches both on.
      - name: Use the Developer ID signing identity
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          sed -i '' "s|^signing-identity = \"-\"|signing-identity = \"${APPLE_SIGNING_IDENTITY}\"|" \
            crates/oxbench-app/Cargo.toml
          grep -n "signing-identity" crates/oxbench-app/Cargo.toml

      - name: Build the installers
        working-directory: crates/oxbench-app
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Secrets that are not set arrive as empty strings, which cargo-packager would take as
        # credentials, so they are removed first.
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          cargo packager --release --formats ${{ matrix.formats }}

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: ${{ matrix.files }}

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: oxbench-${{ runner.os }}
          path: ${{ matrix.files }}
